<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>От Салиха — 3D Heart (Режим Зрителя)</title>
    <meta name="description" content="Интерактивный 3D-туннель и сердце из светящихся надписей.">
    <!-- Open Graph Metadata (Clean Preview without photos) -->
    <meta property="og:title" content="От Салиха — 3D Heart">
    <meta property="og:description" content="Интерактивное 3D сердце из светящихся надписей.">
    <meta property="og:type" content="website">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Outfit:wght@300;400;600;700&family=Great+Vibes&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <!-- Three.js 3D Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body class="mode-viewer">

    <!-- Gate Screen / Access Control Overlay -->
    <div id="gateScreen" class="gate-screen">
        <div class="gate-card" id="gateCard">
            <div class="gate-icon">🔐</div>
            <h2>Проверка доступа</h2>
            <p class="gate-subtitle">Для кого забилось это сердце?</p>

            <div class="gate-input-group">
                <input type="text" id="gateInput" placeholder="Введите ваше имя..." autocomplete="off">
                <button id="gateBtn" class="btn btn-primary">Проверить</button>
            </div>

            <div id="gateError" class="gate-error"></div>
        </div>
    </div>

    <!-- Photo Modal Easter Egg Overlay -->
    <div id="photoModal" class="photo-modal">
        <div class="photo-modal-card">
            <button id="closePhotoBtn" class="photo-close-btn" aria-label="Закрыть">&times;</button>
            <div class="photo-wrapper">
                <img id="photoImg" alt="Фотография">
            </div>
            <p class="photo-caption" id="photoCaption"></p>
        </div>
    </div>

    <!-- Background Layer of Repeating "LOVE YOU" Text -->
    <div id="bg-pattern"></div>

    <!-- Three.js Canvas Container -->
    <div id="canvasContainer"></div>

    <!-- Header Overlay -->
    <header class="app-header">
        <div class="logo">
            <span class="heart-icon">♥</span>
            <span class="logo-title">От Салиха</span>
        </div>
        <div class="subtitle">С любовью и кодом</div>
    </header>

    <!-- Footer / Interaction hint -->
    <footer class="interaction-hint" id="footerHint">
        <span>💡 Нажмите</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
